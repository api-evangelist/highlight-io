  humanURL: https://github.com/highlight/highlight/tree/main/backend/private-graph
  properties:
  - url: https://github.com/highlight/highlight/tree/main/backend/private-graph
    type: Documentation
  - url: https://www.highlight.io/docs/general/product-features/general-features/api
    type: Documentation
  description: >-
    Internal GraphQL API that powers the Highlight dashboard at `https://pri.highlight.io`. Used to list,
    search, and manage workspaces, projects, sessions, errors, logs, traces, dashboards, alerts, and integrations.
    Authenticated via dashboard session cookie or workspace admin API token; the schema is open-source
    under `backend/private-graph/graph` but is not a stable public contract.
- aid: highlight-io:highlight-webhooks-api
  name: Highlight Webhooks API
  tags:
  - Observability
  - Webhooks
  - Alerts
  - Notifications
  humanURL: https://www.highlight.io/docs/general/product-features/general-features/webhooks
  properties:
  - url: https://www.highlight.io/docs/general/product-features/general-features/webhooks
    type: Documentation
  - url: openapi/_original/highlight-webhooks-api-openapi.yml
    type: AsyncEvents
  description: >-
    Outbound webhooks delivered when Highlight alerts fire. POST JSON payload to a customer-supplied URL
    with alert metadata (name, type, count), error/session/log/metric context, project routing, and action
    URLs to resolve, ignore, or snooze. Supports Error, Session, User, Log, Trace, and Metric monitor
    alerts.
- aid: highlight-io:highlight-self-hosted-api
  name: Highlight Self-Hosted Deployment
  tags:
  - Observability
  - Self-Hosted
  - Open Source
  - Docker
  - Kubernetes
  humanURL: https://www.highlight.io/docs/general/company/open-source/self-host-hobby
