    type: Documentation
  - url: https://github.com/highlight/highlight/tree/main/docker
    type: SourceCode
  description: >-
    Self-hosted deployment of the open-source Highlight stack. Three tiers — Dev (single-host docker-compose),
    Hobby (single-host Docker for low-volume production), and Enterprise (Kubernetes with horizontal scaling,
    ClickHouse cluster, and managed retention). All ingestion endpoints (OTLP traces, logs, metrics; pub.highlight.io
    session ingestion; pri.highlight.io GraphQL) are reproduced in-cluster.
